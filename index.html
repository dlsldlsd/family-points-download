<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка APK</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, sans-serif;
    background: #0f1115; color: #e9edf3;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 480px; width: 100%;
    background: #171a21; border: 1px solid #262b35;
    border-radius: 24px; padding: 28px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: #8b93a1; margin: 0 0 20px; font-size: 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #8b93a1; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px; margin-bottom: 14px;
    background: #1e222d; border: 1px solid #262b35;
    border-radius: 10px; color: #e9edf3; font-size: 14px; font-family: inherit;
  }
  .drop {
    border: 2px dashed #2f5fcc; border-radius: 16px;
    padding: 32px 16px; text-align: center; cursor: pointer;
    transition: background .2s; margin-bottom: 16px;
  }
  .drop:hover, .drop.active { background: #1e222d; }
  .drop .icon { font-size: 40px; margin-bottom: 8px; }
  .drop .text { font-size: 15px; color: #e9edf3; }
  .drop .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
  button {
    width: 100%; padding: 14px; background: #4f8cff; color: #fff;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:active { background: #2f5fcc; }
  button:disabled { opacity: .5; }
  .status {
    margin-top: 16px; padding: 12px; border-radius: 10px;
    font-size: 13px; line-height: 1.5; display: none;
  }
  .status.show { display: block; }
  .status.ok { background: rgba(52,199,123,.15); color: #34c77b; }
  .status.err { background: rgba(239,75,90,.15); color: #ef4b5a; }
  .status.info { background: rgba(79,140,255,.15); color: #4f8cff; }
  .result {
    margin-top: 16px; padding: 14px; background: #1e222d;
    border-radius: 12px; display: none; word-break: break-all;
  }
  .result.show { display: block; }
  .result a { color: #4f8cff; font-size: 13px; }
  .result .label { font-size: 11px; color: #8b93a1; margin-bottom: 4px; }
  .small { font-size: 11px; color: #6b7280; margin-top: 12px; text-align: center; }
  .prev {
    font-size: 11px; color: #6b7280; margin-top: 10px;
    padding: 8px; background: #1e222d; border-radius: 8px;
    word-break: break-all; display: none;
  }
  .prev.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>📦 Загрузка APK</h1>
  <p class="sub">Загрузи файл — получишь ссылку. Старая версия удалится только после того, как новая станет доступна.</p>

  <label>GitHub токен</label>
  <input type="password" id="token" placeholder="ghp_..." autocomplete="off">

  <label>Репозиторий (owner/repo)</label>
  <input type="text" id="repo" placeholder="dlsldlsd/family-points-download" autocomplete="off">

  <div class="drop" id="drop">
    <div class="icon">📤</div>
    <div class="text">Перетащи файл сюда</div>
    <div class="hint">или нажми, чтобы выбрать</div>
  </div>
  <input type="file" id="file" hidden>

  <button id="upload" disabled>Загрузить</button>

  <div class="status" id="status"></div>
  <div class="result" id="result"></div>
  <div class="prev" id="prev"></div>

  <div class="small">Токен хранится только в этом браузере</div>
</div>

<script>
const $ = id => document.getElementById(id);
const tokenInput = $('token');
const repoInput = $('repo');
const drop = $('drop');
const fileInput = $('file');
const uploadBtn = $('upload');
const status = $('status');
const result = $('result');
const prev = $('prev');

let selectedFile = null;

// ============ Сохранение настроек ============
tokenInput.value = localStorage.getItem('gh_token') || '';
repoInput.value = localStorage.getItem('gh_repo') || '';

// Показываем прошлую папку
function showPrevFolder() {
  const old = localStorage.getItem('gh_old_folder');
  const url = localStorage.getItem('gh_last_url');
  if (old) {
    prev.innerHTML = `Предыдущая папка: <b>${old}</b>` + (url ? `<br><a href="${url}" target="_blank">${url}</a>` : '');
    prev.className = 'prev show';
  } else {
    prev.className = 'prev';
  }
}
showPrevFolder();

tokenInput.addEventListener('input', () => {
  localStorage.setItem('gh_token', tokenInput.value.trim());
  updateBtn();
});
repoInput.addEventListener('input', () => {
  localStorage.setItem('gh_repo', repoInput.value.trim());
  updateBtn();
});

function updateBtn() {
  uploadBtn.disabled = !(selectedFile && tokenInput.value.trim() && repoInput.value.trim());
}

// ============ Drag & drop ============
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('active'); });
drop.addEventListener('dragleave', () => drop.classList.remove('active'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('active');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function setFile(f) {
  selectedFile = f;
  drop.querySelector('.text').textContent = f.name;
  drop.querySelector('.hint').textContent = (f.size / 1024 / 1024).toFixed(1) + ' МБ';
  updateBtn();
}

// ============ UI helpers ============
function showStatus(msg, type = 'info') {
  status.textContent = msg;
  status.className = 'status show ' + type;
}
function hideStatus() { status.className = 'status'; }
function showResult(url) {
  result.innerHTML = `<div class="label">Ссылка для скачивания:</div><a href="${url}" target="_blank">${url}</a>`;
  result.className = 'result show';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============ GitHub API ============
async function ghApi(path, opts = {}) {
  const [owner, repo] = repoInput.value.split('/');
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/${path}`, {
    ...opts,
    headers: {
      'Authorization': `token ${tokenInput.value.trim()}`,
      'Accept': 'application/vnd.github+json',
      ...(opts.headers || {})
    }
  });
  return res;
}

async function uploadFile(path, base64, message) {
  const res = await ghApi('contents/' + path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: base64, branch: 'main' })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || 'Ошибка загрузки');
  }
  return res.json();
}

async function deleteFolderRecursive(path) {
  const res = await ghApi('contents/' + path);
  if (!res.ok) return;
  const items = await res.json();
  for (const item of items) {
    if (item.type === 'dir') {
      await deleteFolderRecursive(item.path);
    } else {
      await ghApi('contents/' + item.path, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Удаление ${item.path}`,
          sha: item.sha,
          branch: 'main'
        })
      });
    }
  }
}

// ============ Utils ============
function randomId() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Проверяет, доступна ли страница по URL (200). Максимум 24 попытки по 5 сек = 2 минуты
async function waitForPage(url, maxTries = 24, delayMs = 5000) {
  for (let i = 0; i < maxTries; i++) {
    try {
      const res = await fetch(url + '?t=' + Date.now(), { method: 'GET', cache: 'no-store' });
      if (res.status === 200) return true;
    } catch (e) { /* ignore */ }
    showStatus(`Ожидаем сборку GitHub Pages… (${i + 1}/${maxTries})`, 'info');
    await sleep(delayMs);
  }
  return false;
}

// ============ Main upload flow ============
uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  result.className = 'result';
  hideStatus();

  const [owner, repo] = repoInput.value.split('/');
  const newFolder = randomId();
  const oldFolder = localStorage.getItem('gh_old_folder') || null;

  try {
    // --- Шаг 1: загружаем APK в новую папку ---
    const ext = (selectedFile.name.split('.').pop() || 'apk').toLowerCase();
    const fileName = 'file.' + ext;

    showStatus('Шаг 1/4: загружаем APK (10–60 сек)…', 'info');
    const b64 = await fileToBase64(selectedFile);
    await uploadFile(newFolder + '/' + fileName, b64, 'Загрузка APK');

    // --- Шаг 2: создаём index.html для автозагрузки ---
    showStatus('Шаг 2/4: создаём страницу скачивания…', 'info');
    const indexHtml = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=${fileName}">
<title>Скачивание...</title></head>
<body style="background:#0f1115;color:#e9edf3;font-family:sans-serif;text-align:center;padding-top:80px">
Скачивание началось…<br><br>
<a style="color:#4f8cff" href="${fileName}">Скачать вручную</a>
</body></html>`;
    const indexB64 = btoa(unescape(encodeURIComponent(indexHtml)));
    await uploadFile(newFolder + '/index.html', indexB64, 'Создание страницы');

    // --- Шаг 3: ждём, пока новая страница станет доступна ---
    const newUrl = `https://${owner}.github.io/${repo}/${newFolder}/`;
    showStatus('Шаг 3/4: ждём, пока GitHub Pages соберёт новую версию…', 'info');

    const ready = await waitForPage(newUrl);
    if (!ready) {
      showStatus(
        '⚠️ GitHub Pages не успел собраться за 2 минуты. Старая версия НЕ удалена. Подожди пару минут и попробуй ещё раз — новая уже могла появиться.',
        'err'
      );
      // Всё равно сохраняем как новую, но старую не трогаем
      localStorage.setItem('gh_old_folder', newFolder);
      localStorage.setItem('gh_last_url', newUrl);
      showPrevFolder();
      showResult(newUrl);
      return;
    }

    // --- Шаг 4: удаляем старую папку ---
    if (oldFolder && oldFolder !== newFolder) {
      showStatus(`Шаг 4/4: новая версия готова. Удаляем старую папку (${oldFolder})…`, 'info');
      try {
        await deleteFolderRecursive(oldFolder);
      } catch (e) {
        console.warn('Не удалось удалить старую папку:', e);
      }
    } else {
      showStatus('Шаг 4/4: старых папок нет, всё чисто.', 'info');
    }

    // --- Успех ---
    localStorage.setItem('gh_old_folder', newFolder);
    localStorage.setItem('gh_last_url', newUrl);
    showPrevFolder();

    showStatus('✅ Готово! Новая версия доступна, старая удалена.', 'ok');
    showResult(newUrl);
  } catch (e) {
    showStatus('❌ Ошибка: ' + (e.message || e), 'err');
  } finally {
    uploadBtn.disabled = false;
  }
});
</script>
</body>
</html>
