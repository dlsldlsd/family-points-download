<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Загрузка APK</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, sans-serif;
    background: #0f1115; color: #e9edf3;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 480px; width: 100%;
    background: #171a21; border: 1px solid #262b35;
    border-radius: 24px; padding: 28px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: #8b93a1; margin: 0 0 20px; font-size: 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #8b93a1; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px; margin-bottom: 14px;
    background: #1e222d; border: 1px solid #262b35;
    border-radius: 10px; color: #e9edf3; font-size: 14px; font-family: inherit;
  }
  .drop {
    border: 2px dashed #2f5fcc; border-radius: 16px;
    padding: 32px 16px; text-align: center; cursor: pointer;
    transition: background .2s; margin-bottom: 16px;
  }
  .drop:hover, .drop.active { background: #1e222d; }
  .drop .icon { font-size: 40px; margin-bottom: 8px; }
  .drop .text { font-size: 15px; color: #e9edf3; }
  .drop .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
  button {
    width: 100%; padding: 14px; background: #4f8cff; color: #fff;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:active { background: #2f5fcc; }
  button:disabled { opacity: .5; }
  .status {
    margin-top: 16px; padding: 12px; border-radius: 10px;
    font-size: 13px; line-height: 1.5; display: none;
  }
  .status.show { display: block; }
  .status.ok { background: rgba(52,199,123,.15); color: #34c77b; }
  .status.err { background: rgba(239,75,90,.15); color: #ef4b5a; }
  .status.info { background: rgba(79,140,255,.15); color: #4f8cff; }
  .result {
    margin-top: 16px; padding: 14px; background: #1e222d;
    border-radius: 12px; display: none; word-break: break-all;
  }
  .result.show { display: block; }
  .result a { color: #4f8cff; font-size: 13px; }
  .result .label { font-size: 11px; color: #8b93a1; margin-bottom: 4px; }
  .small { font-size: 11px; color: #6b7280; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>📦 Загрузка APK</h1>
  <p class="sub">Загрузи файл — получишь ссылку со случайным именем. Прошлый файл удалится автоматически.</p>

  <label>GitHub токен (сохранится в браузере)</label>
  <input type="password" id="token" placeholder="ghp_..." autocomplete="off">

  <label>Репозиторий (owner/repo)</label>
  <input type="text" id="repo" placeholder="nekigy/family-points-updates" autocomplete="off">

  <div class="drop" id="drop">
    <div class="icon">📤</div>
    <div class="text">Перетащи файл сюда</div>
    <div class="hint">или нажми, чтобы выбрать</div>
  </div>
  <input type="file" id="file" hidden>

  <button id="upload" disabled>Загрузить</button>

  <div class="status" id="status"></div>
  <div class="result" id="result"></div>

  <div class="small">Токен хранится только в этом браузере</div>
</div>

<script>
const $ = id => document.getElementById(id);
const tokenInput = $('token');
const repoInput = $('repo');
const drop = $('drop');
const fileInput = $('file');
const uploadBtn = $('upload');
const status = $('status');
const result = $('result');

let selectedFile = null;

// Загружаем сохранённые данные
tokenInput.value = localStorage.getItem('gh_token') || '';
repoInput.value = localStorage.getItem('gh_repo') || '';
updateBtn();

// Сохраняем токен и репу при изменении
tokenInput.addEventListener('input', () => {
  localStorage.setItem('gh_token', tokenInput.value.trim());
  updateBtn();
});
repoInput.addEventListener('input', () => {
  localStorage.setItem('gh_repo', repoInput.value.trim());
  updateBtn();
});

function updateBtn() {
  uploadBtn.disabled = !(selectedFile && tokenInput.value.trim() && repoInput.value.trim());
}

// Drag&drop
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('active'); });
drop.addEventListener('dragleave', () => drop.classList.remove('active'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('active');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function setFile(f) {
  selectedFile = f;
  drop.querySelector('.text').textContent = f.name;
  drop.querySelector('.hint').textContent = (f.size / 1024 / 1024).toFixed(1) + ' МБ';
  updateBtn();
}

function showStatus(msg, type = 'info') {
  status.textContent = msg;
  status.className = 'status show ' + type;
}

function hideStatus() { status.className = 'status'; }

function showResult(url) {
  result.innerHTML = `
    <div class="label">Ссылка для скачивания:</div>
    <a href="${url}" target="_blank">${url}</a>
  `;
  result.className = 'result show';
}

// =============== GitHub API ===============
async function ghApi(path, opts = {}) {
  const [owner, repo] = repoInput.value.split('/');
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/${path}`, {
    ...opts,
    headers: {
      'Authorization': `token ${tokenInput.value.trim()}`,
      'Accept': 'application/vnd.github+json',
      ...(opts.headers || {})
    }
  });
  return res;
}

// Удаляем все старые папки (не первого уровня depth)
async function cleanupOld() {
  const res = await ghApi('contents');
  if (!res.ok) return;
  const items = await res.json();
  for (const item of items) {
    // Удаляем папки (не файлы типа index.html, .gitignore, README)
    if (item.type === 'dir') {
      // Рекурсивно удаляем содержимое
      await deleteFolder(item.path);
    }
  }
}

async function deleteFolder(path) {
  const res = await ghApi('contents/' + path);
  if (!res.ok) return;
  const items = await res.json();
  for (const item of items) {
    if (item.type === 'dir') {
      await deleteFolder(item.path);
    } else {
      await ghApi('contents/' + item.path, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Удаление ${item.path}`,
          sha: item.sha,
          branch: 'main'
        })
      });
    }
  }
}

function randomId() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      // dataURL: "data:...;base64,XXXX"
      const b64 = reader.result.split(',')[1];
      resolve(b64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadFile(path, base64, message) {
  const res = await ghApi('contents/' + path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: message,
      content: base64,
      branch: 'main'
    })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'Ошибка загрузки');
  }
  return res.json();
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  result.className = 'result';
  showStatus('Шаг 1/3: удаляем старые файлы…', 'info');

  try {
    await cleanupOld();

    showStatus('Шаг 2/3: загружаем APK (может занять 10–30 сек)…', 'info');
    const folder = randomId();
    const ext = selectedFile.name.split('.').pop() || 'apk';
    const fileName = 'file.' + ext;
    const b64 = await fileToBase64(selectedFile);

    // Загружаем файл
    await uploadFile(folder + '/' + fileName, b64, 'Загрузка ' + selectedFile.name);

    // Создаём index.html для автозагрузки
    const indexHtml = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=${fileName}">
<title>Скачивание...</title></head>
<body>Скачивание началось. <a href="${fileName}">Скачать вручную</a></body>
</html>`;
    const indexB64 = btoa(unescape(encodeURIComponent(indexHtml)));
    await uploadFile(folder + '/index.html', indexB64, 'Создание страницы');

    showStatus('Шаг 3/3: получаем ссылку…', 'info');

    // Ссылка на папку
    const [owner, repo] = repoInput.value.split('/');
    const url = `https://${owner}.github.io/${repo}/${folder}/`;

    await new Promise(r => setTimeout(r, 8000)); // ждём GitHub Pages
    showStatus('✅ Готово! GitHub Pages обновляется (может занять 1–2 минуты)', 'ok');
    showResult(url);
  } catch (e) {
    showStatus('❌ Ошибка: ' + e.message, 'err');
  } finally {
    uploadBtn.disabled = false;
  }
});
</script>
</body>
</html>
